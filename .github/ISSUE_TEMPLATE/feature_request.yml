name: Feature request
description: Propose a new capability or workflow improvement.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please check existing issues and the [roadmap](../../docs/00-project/roadmap.md). For workflow-shape changes, an ADR may be required — see [`docs/02-architecture/`](../../docs/02-architecture/).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected? When does it bite today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        Concrete shape of the change. CLI surface (new flag / subcommand?), plugin surface (new skill / slash command?), file-state changes, or behavioural shifts.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other shapes you weighed and why this one wins.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - In-scope (extends existing primitives)
        - Out-of-scope (new primitive — likely requires an ADR)
        - Unsure
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd like to send a PR for this once accepted.
