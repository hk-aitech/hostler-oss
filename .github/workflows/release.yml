name: Release

# Triggered when a `v*` tag is pushed (e.g. v0.1.0, v0.2.1).
# Cross-compiles the hstl-oss CLI for the supported OS/arch matrix,
# packages each as a tarball (zip on Windows), generates SHA256 checksums,
# and uploads everything as a GitHub Release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: tar.gz
          - os: linux
            arch: arm64
            ext: tar.gz
          - os: darwin
            arch: amd64
            ext: tar.gz
          - os: darwin
            arch: arm64
            ext: tar.gz
          - os: windows
            arch: amd64
            ext: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: packages/hostler-cli/go.sum

      - name: Resolve version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOTOOLCHAIN: auto
          CGO_ENABLED: 0
        run: |
          cd packages/hostler-cli
          mkdir -p ../../dist
          BIN_NAME=hstl-oss
          [ "${{ matrix.os }}" = "windows" ] && BIN_NAME=hstl-oss.exe
          go build -trimpath \
            -ldflags "-s -w \
              -X 'github.com/hk-aitech/hostler-oss/packages/hostler-cli/cmd/hstl-oss/cmd.Version=${{ steps.version.outputs.tag }}' \
              -X 'github.com/hk-aitech/hostler-oss/packages/hostler-cli/cmd/hstl-oss/cmd.Commit=${GITHUB_SHA::8}' \
              -X 'github.com/hk-aitech/hostler-oss/packages/hostler-cli/cmd/hstl-oss/cmd.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o "../../dist/${BIN_NAME}" ./cmd/hstl-oss

      - name: Package
        run: |
          cd dist
          ASSET=hstl-oss-${{ steps.version.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -j "${ASSET}.zip" hstl-oss.exe ../LICENSE ../NOTICE ../README.md
            rm hstl-oss.exe
          else
            mkdir "${ASSET}"
            mv hstl-oss "${ASSET}/"
            cp ../LICENSE ../NOTICE ../README.md "${ASSET}/"
            tar czf "${ASSET}.tar.gz" "${ASSET}"
            rm -rf "${ASSET}"
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/hstl-oss-${{ steps.version.outputs.tag }}-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          ls
          sha256sum hstl-oss-*-* > SHA256SUMS
          cat SHA256SUMS

      - name: Stage installer script
        run: cp scripts/install.sh dist/install.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "hstl-oss $GITHUB_REF_NAME" \
            --generate-notes \
            dist/hstl-oss-*-* dist/SHA256SUMS dist/install.sh
